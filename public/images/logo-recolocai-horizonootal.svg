<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D084;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00F5A0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="envelopeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A2540;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3a5c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Ícone: Envelope com seta -->
  <g transform="translate(10, 20)">
    <!-- Envelope base -->
    <rect x="5" y="15" width="55" height="40" rx="6" fill="url(#envelopeGrad)" stroke="url(#greenGrad)" stroke-width="2.5"/>
    
    <!-- Aba do envelope -->
    <path d="M 5 21 L 32.5 40 L 60 21" stroke="url(#greenGrad)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Seta de ascensão (carreira subindo) -->
    <g transform="translate(32.5, 10)">
      <circle cx="0" cy="0" r="12" fill="url(#greenGrad)"/>
      <path d="M 0 -6 L 0 6 M -4 -2 L 0 -6 L 4 -2" stroke="#0A2540" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- Ponto pulsante (IA ativa) -->
    <circle cx="55" cy="20" r="3" fill="#00F5A0">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Texto: recoloc.ai -->
  <g transform="translate(90, 65)">
    <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="42" fill="#FFFFFF">recoloc</text>
    <text x="175" y="0" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="42" fill="url(#greenGrad)">.ai</text>
  </g>
  
  <!-- Tagline -->
  <text x="95" y="88" font-family="Inter, Arial, sans-serif" font-weight="500" font-size="11" fill="#8a9bb0" letter-spacing="2">SUA AGÊNCIA DE EMPREGO PESSOAL</text>
</svg>
